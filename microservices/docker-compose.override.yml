# ============================================================
# IoBuild — Docker Compose Override (Desarrollo Local)
# ============================================================
# Este archivo se mergea automáticamente con docker-compose.yml
# cuando ejecutás "docker compose up -d" en local.
#
# En producción (Dokploy), no se usa — solo se despliega
# docker-compose.yml directamente.

services:
  # ── Exponer puertos para debugging local ──
  gateway:
    ports:
      - "8080:8080" # Acceso directo al Gateway para testing

  iam:
    ports:
      - "5001:5001" # Debug individual del servicio

  devices:
    ports:
      - "5002:5002"

  projects:
    ports:
      - "5003:5003"

  subscriptions:
    ports:
      - "5004:5004"

  analytics:
    ports:
      - "5005:5005"

  profiles:
    ports:
      - "5006:5006"

  mysql-iam:
    ports:
      - "3307:3306"

  mysql-devices:
    ports:
      - "3308:3306"

  mysql-projects:
    ports:
      - "3309:3306"

  mysql-subscriptions:
    ports:
      - "3310:3306"

  mysql-analytics:
    ports:
      - "3311:3306"

  mysql-profiles:
    ports:
      - "3312:3306"

  frontend:
    ports:
      - "80:80" # Frontend local

  influxdb:
    ports:
      - "8086:8086" # InfluxDB UI/API local

  rabbitmq:
    ports:
      - "5672:5672"   # AMQP — local debugging only
      - "15672:15672" # Management UI — http://localhost:15672

  mosquitto:
    ports:
      - "1883:1883"   # MQTT — local debugging only

  redis:
    ports:
      - "6379:6379"   # Redis — local debugging only

  jaeger:
    ports:
      - "16686:16686"   # Jaeger UI — http://localhost:16686
