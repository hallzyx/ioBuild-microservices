# ============================================================
# IoBuild Microservices — Docker Compose
# ============================================================
# Uso:
#   docker compose up -d          # Iniciar todo
#   docker compose ps              # Ver estado
#   docker compose logs -f <svc>   # Logs de un servicio
#   docker compose down            # Detener y limpiar
#   docker compose down -v         # Detener + borrar datos MySQL
# ============================================================

services:
  # ──────────────────────────────────────────
  # MySQL — Base de datos por microservicio
  # Cada servicio tiene su propio contenedor
  # para aislamiento real de fallos.
  # ──────────────────────────────────────────
  mysql-iam:
    image: mysql:8.0
    container_name: iobuild-mysql-iam
    restart: unless-stopped
    mem_limit: 256m
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-iobuild123}
      - MYSQL_DATABASE=iobuild_iam
    volumes:
      - mysql_iam_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - iobuild-network

  mysql-devices:
    image: mysql:8.0
    container_name: iobuild-mysql-devices
    restart: unless-stopped
    mem_limit: 256m
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-iobuild123}
      - MYSQL_DATABASE=iobuild_devices
    volumes:
      - mysql_devices_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - iobuild-network

  mysql-projects:
    image: mysql:8.0
    container_name: iobuild-mysql-projects
    restart: unless-stopped
    mem_limit: 256m
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-iobuild123}
      - MYSQL_DATABASE=iobuild_projects
    volumes:
      - mysql_projects_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - iobuild-network

  mysql-subscriptions:
    image: mysql:8.0
    container_name: iobuild-mysql-subscriptions
    restart: unless-stopped
    mem_limit: 256m
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-iobuild123}
      - MYSQL_DATABASE=iobuild_subscriptions
    volumes:
      - mysql_subscriptions_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - iobuild-network

  mysql-analytics:
    image: mysql:8.0
    container_name: iobuild-mysql-analytics
    restart: unless-stopped
    mem_limit: 256m
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-iobuild123}
      - MYSQL_DATABASE=iobuild_analytics
    volumes:
      - mysql_analytics_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - iobuild-network

  mysql-profiles:
    image: mysql:8.0
    container_name: iobuild-mysql-profiles
    restart: unless-stopped
    mem_limit: 256m
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-iobuild123}
      - MYSQL_DATABASE=iobuild_profiles
    volumes:
      - mysql_profiles_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - iobuild-network

  # ──────────────────────────────────────────
  # IoBuild.IAM — Auth & Identity (5001)
  # ──────────────────────────────────────────
  iam:
    build:
      context: .
      dockerfile: src/IoBuild.IAM/Dockerfile
    container_name: iobuild-iam
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      mysql-iam:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:5001
      - ASPNETCORE_ENVIRONMENT=Production
      - DB_HOST=mysql-iam
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-iobuild123}
      - DB_NAME=iobuild_iam
      - JWT_SECRET=${JWT_SECRET:-dev-fallback-key-minimum-32-characters!!}
      - RabbitMq__ConnectionString=amqp://${RABBITMQ_USER:-iobuild}:${RABBITMQ_PASS:-iobuild}@rabbitmq:5672/
    networks:
      - iobuild-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  # ──────────────────────────────────────────
  # IoBuild.Devices — Gestión IoT (5002)
  # ──────────────────────────────────────────
  devices:
    build:
      context: .
      dockerfile: src/IoBuild.Devices/Dockerfile
    container_name: iobuild-devices
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      mysql-devices:
        condition: service_healthy
      iam:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      mosquitto:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:5002
      - ASPNETCORE_ENVIRONMENT=Production
      - DB_HOST=mysql-devices
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-iobuild123}
      - DB_NAME=iobuild_devices
      - JWT_SECRET=${JWT_SECRET:-dev-fallback-key-minimum-32-characters!!}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-iobuild-telemetry-token}
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - RabbitMq__ConnectionString=amqp://${RABBITMQ_USER:-iobuild}:${RABBITMQ_PASS:-iobuild}@rabbitmq:5672/
    networks:
      - iobuild-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ──────────────────────────────────────────
  # IoBuild.Projects — Proyectos (5003)
  # ──────────────────────────────────────────
  projects:
    build:
      context: .
      dockerfile: src/IoBuild.Projects/Dockerfile
    container_name: iobuild-projects
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      mysql-projects:
        condition: service_healthy
      iam:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:5003
      - ASPNETCORE_ENVIRONMENT=Production
      - DB_HOST=mysql-projects
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-iobuild123}
      - DB_NAME=iobuild_projects
      - JWT_SECRET=${JWT_SECRET:-dev-fallback-key-minimum-32-characters!!}
      - RabbitMq__ConnectionString=amqp://${RABBITMQ_USER:-iobuild}:${RABBITMQ_PASS:-iobuild}@rabbitmq:5672/
    networks:
      - iobuild-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ──────────────────────────────────────────
  # IoBuild.Subscriptions — Pagos (5004)
  # ──────────────────────────────────────────
  subscriptions:
    build:
      context: .
      dockerfile: src/IoBuild.Subscriptions/Dockerfile
    container_name: iobuild-subscriptions
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      mysql-subscriptions:
        condition: service_healthy
      iam:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:5004
      - ASPNETCORE_ENVIRONMENT=Production
      - DB_HOST=mysql-subscriptions
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-iobuild123}
      - DB_NAME=iobuild_subscriptions
      - JWT_SECRET=${JWT_SECRET:-dev-fallback-key-minimum-32-characters!!}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    networks:
      - iobuild-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ──────────────────────────────────────────
  # IoBuild.Analytics — Dashboards (5005)
  # ──────────────────────────────────────────
  analytics:
    build:
      context: .
      dockerfile: src/IoBuild.Analytics/Dockerfile
    container_name: iobuild-analytics
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      mysql-analytics:
        condition: service_healthy
      iam:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:5005
      - ASPNETCORE_ENVIRONMENT=Production
      - DB_HOST=mysql-analytics
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-iobuild123}
      - DB_NAME=iobuild_analytics
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-iobuild-telemetry-token}
      - RabbitMq__ConnectionString=amqp://${RABBITMQ_USER:-iobuild}:${RABBITMQ_PASS:-iobuild}@rabbitmq:5672/
    networks:
      - iobuild-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ──────────────────────────────────────────
  # IoBuild.Profiles — User Profiles (5006)
  # ──────────────────────────────────────────
  profiles:
    build:
      context: .
      dockerfile: src/IoBuild.Profiles/Dockerfile
    container_name: iobuild-profiles
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      mysql-profiles:
        condition: service_healthy
      iam:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:5006
      - ASPNETCORE_ENVIRONMENT=Production
      - DB_HOST=mysql-profiles
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-iobuild123}
      - DB_NAME=iobuild_profiles
      - JWT_SECRET=${JWT_SECRET:-dev-fallback-key-minimum-32-characters!!}
    networks:
      - iobuild-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5006/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ──────────────────────────────────────────
  # IoBuild.Gateway — API Gateway (8080)
  # ──────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: src/IoBuild.Gateway/Dockerfile
    container_name: iobuild-gateway
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      iam:
        condition: service_healthy
      devices:
        condition: service_healthy
      projects:
        condition: service_healthy
      subscriptions:
        condition: service_healthy
      analytics:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Docker
    expose:
      - "8080"
    networks:
      - iobuild-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  # ──────────────────────────────────────────
  # RabbitMQ — Message Broker (5672 / 15672)
  # ──────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4-management
    container_name: iobuild-rabbitmq
    restart: unless-stopped
    mem_limit: 256m
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-iobuild}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-iobuild}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - iobuild-network

  # ──────────────────────────────────────────
  # Mosquitto — MQTT Broker (1883)
  # ──────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2-openssl
    container_name: iobuild-mosquitto
    restart: unless-stopped
    mem_limit: 16m
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
    networks:
      - iobuild-network

  # ──────────────────────────────────────────
  # InfluxDB — Time Series Database (8086)
  # ──────────────────────────────────────────
  influxdb:
    image: influxdb:2.7-alpine
    container_name: iobuild-influxdb
    restart: unless-stopped
    mem_limit: 64m
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:-admin123}
      - DOCKER_INFLUXDB_INIT_ORG=iobuild
      - DOCKER_INFLUXDB_INIT_BUCKET=iobuild-telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-iobuild-telemetry-token}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - iobuild-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ──────────────────────────────────────────
  # IoT Simulator — Generador de Telemetría
  # ──────────────────────────────────────────
  simulator:
    build:
      context: ./iot-simulator
      dockerfile: Dockerfile
    container_name: iobuild-simulator
    restart: unless-stopped
    mem_limit: 32m
    depends_on:
      - mosquitto
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    networks:
      - iobuild-network

  # ──────────────────────────────────────────
  # Frontend — Vue 3 + Nginx (80)
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend-docker
      dockerfile: Dockerfile
      args:
        - VITE_CLOUDINARY_CLOUD_NAME=${VITE_CLOUDINARY_CLOUD_NAME:-demo}
        - VITE_CLOUDINARY_UPLOAD_PRESET=${VITE_CLOUDINARY_UPLOAD_PRESET:-unsigned_upload}
    container_name: iobuild-frontend
    restart: unless-stopped
    depends_on:
      - gateway
    expose:
      - "80"
    networks:
      - iobuild-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

# ──────────────────────────────────────────
# Redes y Volúmenes
# ──────────────────────────────────────────
networks:
  iobuild-network:
    driver: bridge

volumes:
  mysql_iam_data:
    driver: local
  mysql_devices_data:
    driver: local
  mysql_projects_data:
    driver: local
  mysql_subscriptions_data:
    driver: local
  mysql_analytics_data:
    driver: local
  mysql_profiles_data:
    driver: local
  mosquitto_data:
    driver: local
  influxdb_data:
    driver: local
