schema: spec-driven
project: fundamentos_arq
detected: 2026-06-17

context: |
  Runtime: .NET 9 (ASP.NET Core Web API, net9.0)
  Architecture: Microservices — 7 services (IAM, Devices, Projects, Subscriptions, Analytics, Profiles, Gateway) + IoT simulator + frontend
  ORM: Entity Framework Core 9 + Pomelo.EntityFrameworkCore.MySql (MySQL / MariaDB)
  Messaging: MQTTnet 5 (IoT telemetry), InfluxDB.Client 4 (time-series analytics)
  Auth: JWT Bearer (BCrypt.Net-Next + System.IdentityModel.Tokens.Jwt)
  API: Swashbuckle (Swagger/OpenAPI), Yarp or custom gateway (port 8080)
  CI: GitHub Actions — build-images.yml (Docker → GHCR); Terraform runs locally
  Containerization: Docker Compose (docker-compose.yml + override + prod)
  Solution: microservices/IoBuild.sln (8 src projects + 4 test projects)

testing:
  strict_tdd: true
  test_command: "dotnet test"
  test_command_dir: microservices/
  framework: xUnit 2.9.2
  bdd: SpecFlow.xUnit 3.9.74
  mocking: Moq 4.20.72
  assertions: FluentAssertions 8.9.0
  coverage:
    available: true
    tool: coverlet.collector 6.0.2
    command: "dotnet test --collect:'XPlat Code Coverage'"
  layers:
    unit:
      available: true
      projects:
        - tests/IoBuild.Devices.Tests
        - tests/IoBuild.IAM.Tests
        - tests/IoBuild.Projects.Tests
        - tests/IoBuild.Subscriptions.Tests
    integration:
      available: true
      type: bash/curl (runtime)
      script: microservices/run_integration_tests.sh
      note: Hits live services on localhost; requires docker-compose up first
    e2e:
      available: false
      note: No Playwright/Cypress/Selenium detected
  quality:
    linter: false
    formatter: false
    type_checker: false
    note: No dotnet-format or Roslyn analyzer config detected; nullable enabled in all projects

rules:
  proposal:
    - Include rollback plan for risky changes
    - Reference affected microservice(s) by name
  specs:
    - Use Given/When/Then for BDD scenarios (SpecFlow feature files)
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Specify which service owns each requirement
  design:
    - Include sequence diagrams for cross-service flows
    - Document architecture decisions with rationale
    - Reference EF Core migration strategy when schema changes
  tasks:
    - Group by service, then by phase
    - Each task should touch at most one microservice
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns (Repository pattern, service layer, shared kernel in IoBuild.Shared)
    tdd: true
    test_command: "dotnet test"
    test_command_dir: microservices/
    red_green_refactor: true
    bdd_first: true
  verify:
    test_command: "dotnet test"
    test_command_dir: microservices/
    build_command: "dotnet build microservices/IoBuild.sln"
    coverage_threshold: 0
    integration_script: microservices/run_integration_tests.sh
  archive:
    - Warn before merging destructive deltas
    - Update impacted domain specs under openspec/specs/{service}/
